<!DOCTYPE html>

<body>
  <h1>Az igenevek</h1>

  <table>
    <tr class="sor1">
      <th colspan="5">Igenevek</th>
    </tr>
    <tr class="sor2">
      <th>Főnévi igenév</th>
      <th colspan="3">Melléknévi igenév</th>
      <th>Határozói igenév</th>
    </tr>
    <tr class="sor3">
      <td>-ni</td>
      <td>folyamatos<br>-ó, -ő</td>
      <td>befejezett<br>-t, -tt</td>
      <td>beálló<br>-andó, -endő</td>
      <td>-va, -ve</td>
    </tr>
    <tr>
      <td>írni</td>
      <td>író</td>
      <td>írt</td>
      <td>írandó</td>
      <td>írva</td>
    </tr>
    <tr>
      <td>olvasni</td>
      <td>olvasó</td>
      <td>olvasott</td>
      <td>olvasandó</td>
      <td>olvasva</td>
    </tr>
  </table>
</body>
